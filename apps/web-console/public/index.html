<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azure Browser Agent</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
        background: #07111f;
        color: #e8f0fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top left, #173054, #07111f 48%); }
      main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); letter-spacing: -0.04em; }
      h2 { margin: 0 0 16px; font-size: 18px; }
      p { color: #a9bad0; line-height: 1.7; }
      .badge { border: 1px solid #31557e; border-radius: 999px; padding: 7px 12px; color: #8fc7ff; white-space: nowrap; }
      .grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 20px; }
      .card { border: 1px solid #243a55; border-radius: 18px; padding: 22px; background: rgba(10, 25, 43, 0.84); box-shadow: 0 18px 70px rgba(0,0,0,.2); }
      label { display: block; margin-bottom: 8px; color: #c8d5e5; font-size: 14px; }
      textarea, select, input[type="text"] { width: 100%; border: 1px solid #315071; border-radius: 12px; padding: 14px; background: #081421; color: inherit; font: inherit; }
      textarea { min-height: 130px; resize: vertical; }
      textarea:focus, select:focus, input[type="text"]:focus { outline: 2px solid #42a5f5; border-color: transparent; }
      select { margin-bottom: 14px; }
      button { margin-top: 14px; width: 100%; border: 0; border-radius: 12px; padding: 13px 18px; background: #3da2ff; color: #04111f; font-weight: 800; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .55; }
      .status { display: flex; align-items: center; gap: 10px; min-height: 32px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #60758e; }
      .dot.running { background: #ffd166; box-shadow: 0 0 14px #ffd166; }
      .dot.awaiting_approval { background: #ffad42; box-shadow: 0 0 14px #ffad42; }
      .dot.awaiting_user_input { background: #70b8ff; box-shadow: 0 0 14px #70b8ff; }
      .dot.completed { background: #65df9b; box-shadow: 0 0 14px #65df9b; }
      .dot.failed { background: #ff7085; }
      .timeline { display: grid; gap: 12px; margin-top: 18px; }
      .step { border-left: 2px solid #315071; padding: 3px 0 3px 16px; }
      .step strong { display: block; margin-bottom: 5px; }
      .muted { color: #8396ad; font-size: 13px; }
      pre { margin: 10px 0 0; padding: 12px; overflow: auto; border-radius: 10px; background: #050d17; color: #b9d8f7; font-size: 12px; white-space: pre-wrap; }
      .evidence { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
      figure { margin: 0; min-width: 0; }
      figure img { display: block; width: 100%; aspect-ratio: 11 / 7; object-fit: cover; object-position: top; border: 1px solid #315071; border-radius: 10px; background: #050d17; }
      figcaption { margin-top: 6px; color: #8396ad; font-size: 12px; }
      .empty { padding: 48px 12px; text-align: center; color: #71859e; }
      .candidate { margin-top: 14px; padding: 14px; border: 1px solid #277a65; border-radius: 11px; background: rgba(31, 137, 103, .12); }
      .candidate strong { color: #65dfb1; }
      .availability-days { display: grid; gap: 10px; margin-top: 14px; }
      .availability-day { border: 1px solid #277a65; border-radius: 11px; background: rgba(31, 137, 103, .08); overflow: hidden; }
      .availability-day summary { padding: 13px 14px; cursor: pointer; color: #65dfb1; font-weight: 800; }
      .availability-day[open] summary { border-bottom: 1px solid #245e50; }
      .availability-table-wrap { padding: 8px 10px 12px; }
      .availability-table { width: 100%; table-layout: fixed; border-collapse: collapse; }
      .availability-table th, .availability-table td { padding: 9px 6px; border-bottom: 1px solid #245e50; text-align: left; vertical-align: middle; overflow-wrap: anywhere; }
      .availability-table th { color: #8396ad; font-size: 12px; }
      .availability-table th:nth-child(1) { width: 82px; }
      .availability-table th:nth-child(3) { width: 112px; }
      .availability-table th:nth-child(4) { width: 88px; }
      .availability-table tr:last-child td { border-bottom: 0; }
      .facility-select { width: 100%; min-width: 0; margin: 0; padding: 8px 6px; font-size: 12px; }
      .email-options { display: grid; gap: 5px; }
      .email-options label { display: inline-flex; align-items: center; gap: 5px; margin: 0; color: #c8d5e5; font-size: 13px; cursor: pointer; }
      .slot-select { width: 100%; min-width: 0; margin: 0; padding: 9px 6px; font-size: 12px; }
      .conversation { display: grid; gap: 10px; margin: 0 0 18px; max-height: 320px; overflow: auto; }
      .message { padding: 11px 13px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; }
      .message.user { margin-left: 28px; background: #15385d; }
      .message.assistant { margin-right: 28px; background: #102b25; border: 1px solid #245e50; }
      .approval { margin-top: 16px; padding: 16px; border: 2px solid #d88728; border-radius: 12px; background: rgba(216, 135, 40, .12); }
      .approval strong { color: #ffc46b; }
      .approval button { background: #ffad42; }
      .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .choice-row button:last-child { background: #8fa4ba; }
      .alias-manager { margin-top: 18px; border-top: 1px solid #243a55; padding-top: 16px; }
      .alias-manager summary { cursor: pointer; color: #8fc7ff; font-weight: 800; }
      .alias-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-top: 14px; }
      .alias-form button { width: auto; margin: 0; white-space: nowrap; }
      .alias-list { display: grid; gap: 7px; margin-top: 12px; }
      .alias-row { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid #243a55; border-radius: 9px; }
      .alias-row button { width: auto; margin: 0; padding: 7px 10px; background: #8fa4ba; }
      .alias-arrow { color: #65dfb1; }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
      @media (max-width: 520px) { .alias-form { grid-template-columns: 1fr; } .alias-row { grid-template-columns: 1fr auto; } .alias-arrow { display: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="muted"></div>
          <h1>Azure Browser Agent</h1>
          <p style="display: none"></p>
        </div>
        <div id="mode-badge" class="badge" style="display: none"></div>
      </header>
      <div class="grid">
        <section class="card">
          <h2>新しいRun</h2>
          <div id="conversation" class="conversation"></div>
          <form id="run-form">
            <label for="site">対象サイト</label>
            <select id="site">
              <option value="desknets">DeskNet's</option>
              <option value="mock">Mock site</option>
            </select>
            <label for="prompt">Agentへの指示</label>
            <textarea id="prompt" required placeholder="例：テスト可能な参加者名と本日以降の日付を指定してください"></textarea>
            <button id="submit" type="submit">送信</button>
          </form>
          <details class="alias-manager">
            <summary>参加者の呼称辞書</summary>
            <p class="muted">普段の呼び方を、DeskNet'sで検索する正式名へ変換します。</p>
            <form id="alias-form" class="alias-form">
              <div>
                <label for="participant-alias">よく使われる呼称</label>
                <input id="participant-alias" type="text" maxlength="40" required placeholder="例：こうちゃん" />
              </div>
              <div>
                <label for="participant-formal-name">正式名</label>
                <input id="participant-formal-name" type="text" maxlength="40" required placeholder="例：黄子超" />
              </div>
              <button type="submit">登録</button>
            </form>
            <div id="alias-status" class="muted"></div>
            <div id="alias-list" class="alias-list"></div>
          </details>
          <p id="site-note" class="muted">Mock画面から共通空き時間を計算します。</p>
        </section>
        <section class="card">
          <h2 style="display: none"></h2>
          <div id="output" class="empty">Runを開始すると、ここに状態と証跡が表示されます。</div>
        </section>
      </div>
    </main>
    <script>
      const apiBase = "http://127.0.0.1:3001";
      const form = document.querySelector("#run-form");
      const siteInput = document.querySelector("#site");
      const promptInput = document.querySelector("#prompt");
      const submit = document.querySelector("#submit");
      const output = document.querySelector("#output");
      const siteNote = document.querySelector("#site-note");
      const conversation = document.querySelector("#conversation");
      const modeBadge = document.querySelector("#mode-badge");
      const aliasForm = document.querySelector("#alias-form");
      const participantAliasInput = document.querySelector("#participant-alias");
      const participantFormalNameInput = document.querySelector("#participant-formal-name");
      const aliasStatus = document.querySelector("#alias-status");
      const aliasList = document.querySelector("#alias-list");
      const threadId = crypto.randomUUID();
      const renderedAssistantStates = new Set();

      siteInput.addEventListener("change", renderSiteNote);
      renderSiteNote();
      loadParticipantAliases();

      aliasForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        aliasStatus.textContent = "登録しています…";
        try {
          const response = await fetch(`${apiBase}/browser-agent/participant-aliases`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              alias: participantAliasInput.value,
              formalName: participantFormalNameInput.value,
            }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.error ?? "呼称を登録できませんでした。");
          participantAliasInput.value = "";
          participantFormalNameInput.value = "";
          aliasStatus.textContent = "登録しました。";
          await loadParticipantAliases();
        } catch (error) {
          aliasStatus.textContent = error instanceof Error ? error.message : String(error);
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        await submitPrompt(promptInput.value.trim());
      });

      async function submitPrompt(prompt) {
        appendMessage("user", prompt);
        submit.disabled = true;
        output.className = "";
        output.textContent = "Runを作成しています…";
        try {
          const response = await fetch(`${apiBase}/browser-agent/runs`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              site: siteInput.value,
              mode: "read",
              prompt,
              threadId,
            }),
          });
          const run = await response.json();
          if (!response.ok) throw new Error(run.error ?? "Runの作成に失敗しました。");
          render(run);
          await poll(run.id);
          promptInput.value = "";
        } catch (error) {
          renderError(error);
        } finally {
          submit.disabled = false;
        }
      }

      async function poll(runId) {
        for (let attempt = 0; attempt < 2400; attempt += 1) {
          const response = await fetch(`${apiBase}/browser-agent/runs/${runId}`);
          const run = await response.json();
          if (!response.ok) throw new Error(run.error ?? "Runの取得に失敗しました。");
          render(run);
          if (["awaiting_user_input", "awaiting_approval", "completed", "failed", "cancelled"].includes(run.status)) {
            const assistantState = `${run.id}:${run.status}`;
            if (["awaiting_user_input", "awaiting_approval", "completed"].includes(run.status) && !renderedAssistantStates.has(assistantState)) {
              appendMessage("assistant", run.result?.assistantMessage ?? run.result?.summary ?? "完了しました。");
              renderedAssistantStates.add(assistantState);
            }
            return;
          }
          await new Promise((resolve) => setTimeout(resolve, 250));
        }
        throw new Error("Runの完了待ちがタイムアウトしました。");
      }

      async function loadParticipantAliases() {
        try {
          const response = await fetch(`${apiBase}/browser-agent/participant-aliases`);
          const body = await response.json();
          if (!response.ok) throw new Error(body.error ?? "呼称辞書を取得できませんでした。");
          renderParticipantAliases(body.aliases ?? []);
        } catch (error) {
          aliasStatus.textContent = error instanceof Error ? error.message : String(error);
        }
      }

      function renderParticipantAliases(aliases) {
        aliasList.replaceChildren();
        if (aliases.length === 0) {
          aliasList.append(element("div", "muted", "登録はありません。"));
          return;
        }
        for (const entry of aliases) {
          const row = element("div", "alias-row");
          const remove = element("button", "", "削除");
          remove.type = "button";
          remove.addEventListener("click", async () => {
            remove.disabled = true;
            try {
              const response = await fetch(
                `${apiBase}/browser-agent/participant-aliases/${encodeURIComponent(entry.alias)}`,
                { method: "DELETE" },
              );
              const body = await response.json();
              if (!response.ok) throw new Error(body.error ?? "呼称を削除できませんでした。");
              aliasStatus.textContent = "削除しました。";
              await loadParticipantAliases();
            } catch (error) {
              remove.disabled = false;
              aliasStatus.textContent = error instanceof Error ? error.message : String(error);
            }
          });
          row.append(
            element("span", "", entry.alias),
            element("span", "alias-arrow", "→"),
            element("span", "", entry.formalName),
            remove,
          );
          aliasList.append(row);
        }
      }

      function render(run) {
        output.replaceChildren();
        const status = element("div", "status");
        const statusLabel = run.status === "completed" ? "完了" : run.status === "running" ? "処理中.." : run.status;
        status.append(element("span", `dot ${run.status}`), element("strong", "", statusLabel));
        output.append(
          status,
        );
        modeBadge.textContent = "";

        if (run.result) {
          output.append(element("p", "", "以下の候補から選択してください。するとdesknetsの「予定の追加」の画面が開くので、手動で予定を確定させてください。"));
          if (run.task?.type === "find_availability") {
            output.append(renderActionableAvailabilityByDate(
              run.result.availability ?? [],
              run.task.durationMinutes,
              run.task.date,
              run.task.endDate,
            ));
          }
          if (run.task?.type === "find_facility_availability") {
            const slots = (run.result.availability ?? []).slice(0, 50);
            output.append(renderActionableAvailabilityByDate(
              slots,
              slots[0]?.durationMinutes ?? 60,
            ));
          }
          if (run.status === "awaiting_user_input" && run.result.meetingProposal) {
            output.append(renderMeetingProposal(run.result.meetingProposal));
          }
          if (run.status === "awaiting_user_input" && run.result.manualActionRequest) {
            output.append(renderManualHandoff(run.result.manualActionRequest));
          }
        }

        if (run.error) {
          output.append(element("p", "", run.error));
          output.append(renderBackToCandidatesButton());
        }
      }

      function renderBackToCandidatesButton() {
        const wrap = element("div", "choice-row");
        const back = element("button", "", "候補に戻る");
        back.type = "button";
        back.addEventListener("click", () => submitPrompt("候補に戻して"));
        wrap.append(back);
        return wrap;
      }

      function renderMeetingProposal(proposal) {
        const panel = element("div", "approval");
        panel.append(
          element("strong", "", "ミーティング内容の確認"),
          element("p", "", `日時: ${formatSlot(proposal)}\n参加者: ${proposal.participantIds.join("、")}\n会議室: ${proposal.facilityId}\n\n出席者（本人を含む）へメールを送信しますか？`),
        );
        const choices = element("div", "choice-row");
        const withEmail = element("button", "", "はい、メール送信する");
        withEmail.type = "button";
        withEmail.addEventListener("click", () => submitPrompt("はい"));
        const withoutEmail = element("button", "", "いいえ、送信しない");
        withoutEmail.type = "button";
        withoutEmail.addEventListener("click", () => submitPrompt("いいえ"));
        choices.append(withEmail, withoutEmail);
        panel.append(choices);
        return panel;
      }

      function renderActionableAvailabilityByDate(slots, durationMinutes, startDate, endDate) {
        const container = element("div", "availability-days");
        const grouped = new Map();
        if (startDate && endDate) {
          const cursor = new Date(`${startDate}T00:00:00Z`);
          const last = Date.parse(`${endDate}T00:00:00Z`);
          while (cursor.getTime() <= last) {
            grouped.set(cursor.toISOString().slice(0, 10), []);
            cursor.setUTCDate(cursor.getUTCDate() + 1);
          }
        }
        for (const slot of slots) {
          const dateKey = japanDateKey(slot.start);
          if (!grouped.has(dateKey)) grouped.set(dateKey, []);
          grouped.get(dateKey).push(slot);
        }
        if (grouped.size === 0) {
          container.append(element("div", "muted", "指定期間内に候補はありません。"));
          return container;
        }
        const collapseDays = slots.length > 10;
        for (const [dateKey, daySlots] of grouped) {
          const details = element("details", "availability-day");
          details.open = !collapseDays;
          const summary = element(
            "summary",
            "",
            `${formatJapanDate(dateKey)}（${daySlots.length === 0 ? "候補なし" : `${daySlots.length}枠・${durationMinutes}分`}）`,
          );
          const tableWrap = element("div", "availability-table-wrap");
          if (daySlots.length === 0) {
            tableWrap.append(element("div", "muted", "この日の候補はありません。"));
          } else {
            tableWrap.append(renderAvailabilityTable(daySlots, dateKey));
          }
          details.append(summary, tableWrap);
          container.append(details);
        }
        return container;
      }

      function renderAvailabilityTable(slots, dateKey) {
        const table = element("table", "availability-table");
        const head = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (const label of ["時間", "空き会議室", "メール", ""]) {
          headRow.append(element("th", "", label));
        }
        head.append(headRow);
        const body = document.createElement("tbody");
        slots.forEach((slot, index) => {
          const row = document.createElement("tr");
          const timeCell = document.createElement("td");
          timeCell.textContent = formatSlotTime(slot);

          const facilityCell = document.createElement("td");
          const facilitySelect = element("select", "facility-select");
          for (const facility of slot.availableFacilityIds ?? []) {
            const option = document.createElement("option");
            option.value = facility;
            option.textContent = facility;
            facilitySelect.append(option);
          }
          const preferredFacility = Array.from(facilitySelect.options).find((option) =>
            option.value.normalize("NFKC").replace(/\s+/g, "").toUpperCase().includes("ミーティングルームC")
          );
          if (preferredFacility) facilitySelect.value = preferredFacility.value;
          facilityCell.append(facilitySelect);

          const emailCell = document.createElement("td");
          const emailOptions = element("div", "email-options");
          const radioName = `email-${dateKey}-${index}-${crypto.randomUUID()}`;
          const sendEmail = radioChoice(radioName, "send", "送信する", true);
          const noEmail = radioChoice(radioName, "none", "送信しない", false);
          emailOptions.append(sendEmail.label, noEmail.label);
          emailCell.append(emailOptions);

          const actionCell = document.createElement("td");
          const choose = element("button", "slot-select", "選択する");
          choose.type = "button";
          choose.disabled = facilitySelect.options.length === 0;
          choose.addEventListener("click", async () => {
            const facility = facilitySelect.value;
            if (!facility) return;
            choose.disabled = true;
            const prompt = directBookingPrompt(slot, facility, sendEmail.input.checked);
            await submitPrompt(prompt);
          });
          actionCell.append(choose);
          row.append(timeCell, facilityCell, emailCell, actionCell);
          body.append(row);
        });
        table.append(head, body);
        return table;
      }

      function radioChoice(name, value, text, checked) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = name;
        input.value = value;
        input.checked = checked;
        label.append(input, document.createTextNode(text));
        return { label, input };
      }

      function directBookingPrompt(slot, facility, sendEmail) {
        const start = new Date(slot.start);
        const date = new Intl.DateTimeFormat("ja-JP", {
          timeZone: "Asia/Tokyo",
          month: "numeric",
          day: "numeric",
        }).format(start);
        const emailInstruction = sendEmail ? "メール送信して" : "メール送信しないで";
        return `それでは${date}の${formatSlotTime(slot)}、設備「${facility}」で打ち合わせを設定して。${emailInstruction}`;
      }

      function renderError(error) {
        output.replaceChildren(element("div", "status", error instanceof Error ? error.message : String(error)));
        output.append(renderBackToCandidatesButton());
      }

      function renderManualHandoff(request) {
        const panel = element("div", "approval");
        panel.append(
          element("strong", "", "DeskNet'sで内容確認・手動追加待ち"),
          element("p", "", `議題: ${request.title || "未入力（DeskNet'sで入力してください）"}\n日時: ${formatSlot(request)}\n参加者: ${request.participantIds.join("、")}\n設備: ${request.facilityId}\nメール: ${request.emailNotificationWillBeSent ? "送信する" : "送信しない"}\n自分には通知しない: オフ\n\n専用Edgeに入力済みの予約画面を表示しています。内容を確認し、DeskNet's上の「追加」を押してください。Agentは追加を押しません。\n\n別の候補にしたい場合や、DeskNet'sを閉じてしまった場合は「候補に戻る」を押してください。`),
          renderBackToCandidatesButton(),
        );
        return panel;
      }

      function renderSiteNote() {
        siteNote.textContent = "";
      }

      function appendMessage(role, text) {
        conversation.append(element("div", `message ${role}`, text));
        conversation.scrollTop = conversation.scrollHeight;
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function screenshot(reference, caption) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.src = `${apiBase}${reference}`;
        image.alt = `${caption}のブラウザ証跡`;
        image.loading = "lazy";
        figure.append(image, element("figcaption", "", caption));
        return figure;
      }

      function formatSlot(slot) {
        const formatter = new Intl.DateTimeFormat("ja-JP", {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
        return `${formatter.format(new Date(slot.start))} ～ ${formatter.format(new Date(slot.end))}`;
      }

      function japanDateKey(value) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date(value));
        const read = (type) => parts.find((part) => part.type === type)?.value;
        return `${read("year")}-${read("month")}-${read("day")}`;
      }

      function formatJapanDate(dateKey) {
        return new Intl.DateTimeFormat("ja-JP", {
          timeZone: "Asia/Tokyo",
          month: "long",
          day: "numeric",
          weekday: "short",
        }).format(new Date(`${dateKey}T00:00:00+09:00`));
      }

      function formatSlotTime(slot) {
        const formatter = new Intl.DateTimeFormat("ja-JP", {
          timeZone: "Asia/Tokyo",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
        return `${formatter.format(new Date(slot.start))}〜${formatter.format(new Date(slot.end))}`;
      }
    </script>
  </body>
